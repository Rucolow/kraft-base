<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2d4a3e" />
    <!-- Standalone when added to the home screen, WITHOUT a manifest: iOS then
         keeps the exact URL (token included) as the launch URL. A manifest
         would substitute its static start_url and lose the token. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KB シフト" />
    <meta name="robots" content="noindex" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>KRAFT BASE シフト表</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/rota/main.tsx"></script>
  </body>
</html>
